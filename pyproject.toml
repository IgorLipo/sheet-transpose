[project]
name = "sheet-transpose"
version = "1.0.0"
description = "Transpose engraved sheet-music PDFs in place, preserving layout and annotations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
server = ["fastapi", "uvicorn[standard]", "python-multipart"]
reengrave = ["music21", "verovio", "cairosvg"]

[project.scripts]
sheet-transpose = "sheet_transpose.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sheet_transpose"]
